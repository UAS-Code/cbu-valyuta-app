<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Соя эффектлари -->
    <filter id="shadowMain" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="shadowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    
    <!-- Олтин Градиент -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Банк биноси эмблемаси (Оқ рельефли) -->
  <g filter="url(#shadowMain)" transform="translate(0, -15)">
    <!-- Устки учбурчак том (Фронтон) -->
    <path d="M 512 290 L 320 405 L 704 405 Z" fill="#ffffff" />
    <circle cx="512" cy="362" r="16" fill="url(#gold)" />

    <!-- Том ости устун карнизи -->
    <rect x="306" y="415" width="412" height="20" rx="6" fill="#ffffff" />

    <!-- 4 та асосий колонна (Устунлар) -->
    <rect x="340" y="445" width="42" height="175" rx="8" fill="#ffffff" />
    <rect x="432" y="445" width="42" height="175" rx="8" fill="#ffffff" />
    <rect x="550" y="445" width="42" height="175" rx="8" fill="#ffffff" />
    <rect x="642" y="445" width="42" height="175" rx="8" fill="#ffffff" />

    <!-- Пойдевор (1-ва 2-зинапоялар) -->
    <rect x="290" y="630" width="444" height="24" rx="7" fill="#ffffff" />
    <rect x="264" y="662" width="496" height="30" rx="9" fill="#ffffff" />
  </g>

  <!-- Валюта алмашуви марказий олтин нишони -->
  <g transform="translate(512, 736)" filter="url(#shadowGold)">
    <circle cx="0" cy="0" r="64" fill="url(#gold)" stroke="#ffffff" stroke-width="4" />
    <!-- Алмашиш стрелкалари -->
    <path d="M -24 -8 L 14 -8 M 4 -18 L 18 -8 L 4 2" fill="none" stroke="#044327" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 24 10 L -14 10 M -4 0 L -18 10 L -4 20" fill="none" stroke="#044327" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Ўзбекистон байроғининг ингичка микро-лентаси -->
  <g transform="translate(427, 835)" opacity="0.95">
    <rect x="0" y="0" width="44" height="6" rx="3" fill="#1eb53a" />
    <rect x="49" y="0" width="6" height="6" rx="1.5" fill="#d62612" />
    <rect x="60" y="0" width="50" height="6" rx="3" fill="#ffffff" />
    <rect x="115" y="0" width="6" height="6" rx="1.5" fill="#d62612" />
    <rect x="126" y="0" width="44" height="6" rx="3" fill="#0099b5" />
  </g>
</svg>